[package]
name = "htlc-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Integration tests live in their own crate so the program crate carries no dev-dependencies:
# `anchor idl build` compiles the program's test target, and litesvm's tree needs nightly.

[dependencies]

[dev-dependencies]
satomic-swap = { path = "../../programs/satomic-swap", features = ["no-entrypoint"] }
anchor-lang = "1.2.0"
litesvm = "0.16"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-pubkey = "3"
solana-sha256-hasher = "3.1"
solana-signer = "3"
solana-system-interface = "3.2"
solana-transaction = { version = "4.1", features = ["wincode"] }
solana-account = "4"
solana-program-pack = "3"
spl-token-2022-interface = "2.1"
